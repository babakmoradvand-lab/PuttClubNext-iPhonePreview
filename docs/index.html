<script type="module">
import * as THREE from './three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#b9cfc9');scene.fog=new THREE.Fog('#b9cfc9',45,190);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,260);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.65));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdcefe8,0x344338,2.0));const sun=new THREE.DirectionalLight(0xffe3b4,3.0);sun.position.set(-24,35,15);scene.add(sun);sun.castShadow=false;
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const grass=mat('#63836b'),pathMat=mat('#c5b79d'),water=mat('#3e9c9d',.22,.12),stone=mat('#e1d5bd'),dark=mat('#4a5148'),glass=new THREE.MeshPhysicalMaterial({color:'#a9ceca',roughness:.12,metalness:.08,transparent:true,opacity:.53}),wood=mat('#896b4e'),roof=mat('#303a35'),gold=mat('#cdb47c',.32,.65);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(230,220),grass);floor.rotation.x=-Math.PI/2;floor.position.set(15,-.14,-35);floor.receiveShadow=true;scene.add(floor);
// Range apron and fairway
const fair=new THREE.Mesh(new THREE.PlaneGeometry(155,70),mat('#477653'));fair.rotation.x=-Math.PI/2;fair.position.set(30,-.09,-64);scene.add(fair);
const waterMesh=new THREE.Mesh(new THREE.CircleGeometry(20,64),water);waterMesh.rotation.x=-Math.PI/2;waterMesh.position.set(17,.01,-28);scene.add(waterMesh);
const island=new THREE.Mesh(new THREE.CircleGeometry(5.2,48),mat('#70966e'));island.rotation.x=-Math.PI/2;island.position.set(18,.07,-28);scene.add(island);
const path=new THREE.Mesh(new THREE.PlaneGeometry(5.5,62),pathMat);path.rotation.x=-Math.PI/2;path.position.set(-2,-.02,-23);scene.add(path);
// Six compact, visibly distinct luxury suites, modular in this prototype
const suiteColors=['#c7b28f','#aab4a4','#c49a78','#8f9da0','#d5c7ad','#877e70'];
for(let i=0;i<6;i++){const z=-5-i*6.4;const group=new THREE.Group();group.position.set(-9,0,z);scene.add(group);const base=new THREE.Mesh(new THREE.BoxGeometry(13,3.4,5.7),mat(suiteColors[i]));base.position.y=1.75;group.add(base);const roofMesh=new THREE.Mesh(new THREE.BoxGeometry(13.5,.32,6),roof);roofMesh.position.y=3.65;group.add(roofMesh);const terrace=new THREE.Mesh(new THREE.BoxGeometry(5,.22,5.7),wood);terrace.position.set(9,.15,0);group.add(terrace);const pane=new THREE.Mesh(new THREE.BoxGeometry(.13,2.3,4.4),glass);pane.position.set(6.45,1.85,0);group.add(pane);const hot=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.12,.45,32),mat('#887d68'));hot.position.set(9,.53,.3);group.add(hot);const bed=new THREE.Mesh(new THREE.BoxGeometry(2.5,.42,1.6),mat('#e9e2d5'));bed.position.set(-3,.45,0);group.add(bed);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.18,12,8),gold);lamp.position.set(-5,2.7,2.4);group.add(lamp);}
// Distant flags, trees and contour hills
for(let i=0;i<4;i++){const x=19+i*17;const pole=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,2.5,8),mat('#f3eee3'));pole.position.set(x,1.15,-71);scene.add(pole);const flag=new THREE.Mesh(new THREE.PlaneGeometry(1.1,.55),i===0?gold:mat('#eee6d5'));flag.position.set(x+.5,2.05,-71);scene.add(flag)}
for(let i=0;i<28;i++){const x=-36+(i*17%98),z=-76+(i*23%95);if(x>-17&&x<4&&z>-43&&z<3)continue;const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13,.25,2.1,7),wood);trunk.position.set(x,1,z);scene.add(trunk);const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.35+(i%3)*.28,1),mat(i%3?'#496d55':'#587a60'));crown.position.set(x,2.7,z);scene.add(crown)}
// Player silhouette with layered body, articulated limbs and a putter-like club
const player=new THREE.Group();scene.add(player);const skin=mat('#bd8f6c'),shirt=mat('#e8e3d8'),pants=mat('#303b39'),shoe=mat('#f0ece1'),cap=mat('#d5bd88');
function ballGeo(r,material,x,y,z,group=player){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),material);m.position.set(x,y,z);group.add(m);return m}
function limb(a,b,r1,r2,material,group=player){const v1=new THREE.Vector3(...a),v2=new THREE.Vector3(...b),d=v2.clone().sub(v1);const o=new THREE.Mesh(new THREE.CylinderGeometry(r2,r1,d.length(),10),material);o.position.copy(v1.add(v2).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());group.add(o);return o}
const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.24,.52,5,12),shirt);torso.position.y=1.35;player.add(torso);ballGeo(.16,skin,0,1.78,0);const capMesh=new THREE.Mesh(new THREE.SphereGeometry(.19,16,9,0,Math.PI*2,0,Math.PI*.6),cap);capMesh.position.y=1.94;player.add(capMesh);limb([-.12,1.03,0],[-.15,.52,0],.11,.09,pants);limb([.12,1.03,0],[.15,.52,0],.11,.09,pants);limb([-.15,.52,0],[-.17,.13,.08],.085,.06,pants);limb([.15,.52,0],[.17,.13,.08],.085,.06,pants);ballGeo(.11,shoe,-.17,.1,.12);ballGeo(.11,shoe,.17,.1,.12);limb([-.24,1.5,0],[-.42,1.15,-.08],.075,.06,shirt);limb([.24,1.5,0],[.42,1.18,-.04],.075,.06,shirt);ballGeo(.065,skin,-.42,1.15,-.08);ballGeo(.065,skin,.42,1.18,-.04);limb([.38,1.18,-.04],[.48,.12,-.12],.025,.018,dark);
const golfBall=new THREE.Mesh(new THREE.SphereGeometry(.11,18,14),mat('#fffdf5',.23));golfBall.position.set(0,.12,-1.3);scene.add(golfBall);
const targetRing=new THREE.Mesh(new THREE.RingGeometry(1.25,1.36,48),gold);targetRing.rotation.x=-Math.PI/2;targetRing.position.set(0,.01,-1.3);scene.add(targetRing);
let yaw=0,pitch=.22,dist=7.4,practice=false,moveX=0,moveY=0,vel=0,clock=new THREE.Clock();const target=new THREE.Vector3();let toastTimer;function toast(s){const el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2000)}
function cameraUpdate(){const h=player.position;target.set(h.x,h.y+1.25,h.z);const cp=Math.cos(pitch),sp=Math.sin(pitch);camera.position.set(h.x+Math.sin(yaw)*cp*dist,target.y+sp*dist,h.z+Math.cos(yaw)*cp*dist);camera.lookAt(target)}
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let stickId=null,origin=null;stick.addEventListener('pointerdown',e=>{e.preventDefault();stick.setPointerCapture(e.pointerId);stickId=e.pointerId;const r=stick.getBoundingClientRect();origin={x:r.left+r.width/2,y:r.top+r.height/2};stickMove(e)});function stickMove(e){if(stickId!==e.pointerId)return;const dx=e.clientX-origin.x,dy=e.clientY-origin.y,max=37,m=Math.hypot(dx,dy)||1,x=dx*Math.min(max,m)/m,y=dy*Math.min(max,m)/m;nub.style.left=`calc(50% + ${x}px)`;nub.style.top=`calc(50% + ${y}px)`;moveX=x/max;moveY=y/max}stick.addEventListener('pointermove',stickMove);function stickEnd(e){if(stickId!==e.pointerId)return;stickId=null;moveX=moveY=0;nub.style.left='50%';nub.style.top='50%'}stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX<innerWidth*.42&&e.clientY>innerHeight*.55)return;drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.x=e.clientX;drag.y=e.clientY;yaw-=dx*.006;pitch=THREE.MathUtils.clamp(pitch+dy*.004,-.04,.62)});renderer.domElement.addEventListener('pointerup',e=>{if(drag?.id===e.pointerId)drag=null});renderer.domElement.addEventListener('pointercancel',()=>drag=null);
document.querySelector('#practice').onclick=()=>{practice=!practice;document.querySelector('#state').textContent=practice?'تمرین گلف':'گشت‌وگذار';document.querySelector('#mode').textContent=practice?'حالت تمرین · توپ و هدف فعال':'پیش‌نمایش تعاملی · کنترل لمسی و دوربین';toast(practice?'به محدودهٔ تمرین وارد شدی. کنترل دوربین و هدف را امتحان کن.':'به حالت گشت‌وگذار برگشتی.')};document.querySelector('#look').onclick=()=>toast(practice?'هدف را با کشیدن صفحه تنظیم کن؛ این نمونه فقط برای تست کنترل است.':'نمونهٔ تعاملی: حرکت کن، دوربین را بچرخان و وارد تمرین شو.');
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(Math.abs(moveX)+Math.abs(moveY)>.05){const speed=practice?2.1:3.35;const forward=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw)),right=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));const direction=forward.multiplyScalar(-moveY).add(right.multiplyScalar(moveX));if(direction.lengthSq()>1)direction.normalize();player.position.addScaledVector(direction,speed*dt);const face=Math.atan2(direction.x,direction.z);player.rotation.y=THREE.MathUtils.damp(player.rotation.y,face,7,dt);vel=Math.min(1,vel+dt*3)}else vel=Math.max(0,vel-dt*4);if(practice){golfBall.position.x=player.position.x+Math.sin(player.rotation.y)*-1.3;golfBall.position.z=player.position.z+Math.cos(player.rotation.y)*-1.3;targetRing.position.x=golfBall.position.x;targetRing.position.z=golfBall.position.z-9;}cameraUpdate();renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.65))});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
